<!doctype html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zimmet · Dashboard Önizleme</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#f6f4f8; --surface:#fbfafc; --surface-2:#efebf3; --hover:#e8e3ee; --border:#e1dce8; --border-strong:#cdc5d7;
    --fg:#241a2e; --muted:#6b6275; --subtle:#776e83;
    --accent:#462b55; --accent-hover:#3c1953; --accent-soft:rgb(70 43 85 / .11); --accent-fg:#fff;
    --teal:#0098c0; --link:#00748f; --purple:#462b55; --tilep:#462b55;
    --ok:#1f7a52; --warn:#96660a; --danger:#910c32; --info:#00748f; --ring:rgb(0 152 192 / .35);
    --shadow:0 6px 20px -8px rgb(70 43 85 / .16), 0 1px 3px rgb(70 43 85 / .07); --shadow-lg:0 28px 64px -16px rgb(70 43 85 / .3);
    --plate:transparent;
  }
  [data-theme='dark'] {
    --bg:#150f1b; --surface:#1d1526; --surface-2:#281d34; --hover:#31243f; --border:#33283f; --border-strong:#46385a;
    --fg:#eee9f3; --muted:#a99fb5; --subtle:#8f849d;
    --accent:#1fb0d3; --accent-hover:#3cc3e4; --accent-soft:rgb(31 176 211 / .16); --accent-fg:#06222b;
    --teal:#1fb0d3; --link:#4cc6e6; --purple:#b58bd6; --tilep:#8d5fb0;
    --ok:#5fd3a0; --warn:#e8b64a; --danger:#ff8aa5; --info:#4cc6e6; --ring:rgb(31 176 211 / .45);
    --shadow:0 8px 24px -6px rgb(0 0 0 / .5), 0 1px 3px rgb(0 0 0 / .3); --shadow-lg:0 32px 72px -16px rgb(0 0 0 / .7);
    --plate:#fff;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  button{font:inherit;color:inherit;cursor:pointer} svg{display:block}
  .num{font-variant-numeric:tabular-nums}
  /* ── çerçeve ── */
  .bar{position:fixed;z-index:60;inset:0 0 auto 0;height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
  .bar b{font-size:13px;white-space:nowrap}
  .tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
  .tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:.15s}
  .tab:hover{background:var(--surface-2);color:var(--fg)} .tab[aria-selected=true]{background:var(--accent-soft);color:var(--accent)}
  .iconbtn{border:1px solid var(--border);background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .view{display:none;position:fixed;inset:56px 0 0 0;overflow:auto}.view.on{display:block}
  .note{margin:16px 20px 0;padding:14px 18px;border:1px dashed var(--border-strong);border-radius:16px;background:color-mix(in srgb,var(--accent-soft) 60%,transparent);font-size:13px;color:var(--muted);line-height:1.6;display:flex;gap:18px;flex-wrap:wrap}
  .note b{color:var(--fg)} .note .tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
  .note > div{flex:1;min-width:220px}
  /* ── uygulama kabuğu (maket) ── */
  .app{display:grid;grid-template-columns:232px 1fr;margin:16px 20px 40px;border:1px solid var(--border);border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:var(--shadow-lg)}
  .side{background:var(--surface);border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:4px;min-height:760px}
  .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 18px}
  .brand .mk{width:34px;flex:none;border-radius:10px;padding:0}[data-theme=dark] .brand .mk{background:#fff;padding:5px}
  .brand b{font-size:14.5px;display:block;line-height:1.2}.brand small{font-size:10.5px;color:var(--subtle)}
  .nav{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--muted)}
  .nav.on{background:var(--accent-soft);color:var(--accent)} .nav svg{width:17px;height:17px}
  .top{height:60px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 80%,transparent)}
  .search svg,.iconbtn svg{width:16px;height:16px;flex:none}.search{flex:1;max-width:380px;height:38px;border:1px solid var(--border);background:var(--surface);border-radius:11px;display:flex;align-items:center;gap:9px;padding:0 12px;color:var(--subtle);font-size:13px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
  .main{padding:24px 22px 30px}
  .h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0} .sub{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
  .head{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .btn{height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:.15s;box-shadow:0 1px 2px rgb(70 43 85 / .06)}
  .btn:hover{border-color:var(--border-strong);background:var(--hover)} .btn svg{width:15px;height:15px}
  .btn.p{background:var(--accent);color:var(--accent-fg);border-color:transparent}.btn.p:hover{background:var(--accent-hover)}
  .btn.sm{height:30px;padding:0 11px;font-size:12px;border-radius:9px}
  .seg{display:inline-flex;background:var(--surface-2);padding:3px;border-radius:11px;gap:2px}
  .seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(70 43 85 / .14)}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgb(70 43 85 / .05);position:relative}
  .card h3{margin:0;font-size:14px;font-weight:600} .card .cap{font-size:12px;color:var(--subtle);margin-top:2px}
  .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g12{grid-template-columns:repeat(12,1fr)}
  .s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
  .kpi{display:flex;flex-direction:column;gap:2px;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer}
  .kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .kpi .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:12px}.kpi .ic svg{width:18px;height:18px}
  .kpi .v{font-size:30px;font-weight:600;letter-spacing:-.02em}.kpi .l{font-size:13px;font-weight:600}.kpi .d{font-size:12px;color:var(--subtle);display:flex;gap:6px;align-items:center}
  .kpi .spark{position:absolute;right:14px;top:18px;width:84px;height:34px;opacity:.95}
  .delta{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:99px}.delta.up{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.delta.dn{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}.delta.eq{background:var(--surface-2);color:var(--muted)}
  .tone-a{background:var(--accent-soft);color:var(--accent)}.tone-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.tone-info{background:color-mix(in srgb,var(--info) 14%,transparent);color:var(--info)}.tone-dn{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}.tone-w{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:.15s}
  .chip.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)} .chip b{font-weight:700}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;display:inline-block}
  .mono{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--subtle)}
  .inbox{display:flex;flex-direction:column;gap:2px}
  .it{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:13px;transition:.3s;overflow:hidden;max-height:90px}
  .it:hover{background:var(--surface-2)} .it.gone{opacity:0;max-height:0;padding-top:0;padding-bottom:0;transform:translateX(24px)}
  .it .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}.it .ic svg{width:17px;height:17px}
  .it .t{flex:1;min-width:0}.it .t b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .t span{font-size:12px;color:var(--subtle)}
  .it .acts{display:flex;gap:6px}
  .empty{display:grid;place-items:center;text-align:center;padding:28px 10px;color:var(--muted);font-size:13px;gap:8px}
  .tl{position:relative;padding-left:2px;display:flex;flex-direction:column;gap:16px}.tl::before{content:'';position:absolute;left:16px;top:6px;bottom:6px;width:1px;background:var(--border)}
  .ev{display:flex;gap:11px;position:relative}.ev .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;box-shadow:0 0 0 4px var(--surface)}.ev .ic svg{width:15px;height:15px}
  .ev p{margin:0;font-size:13px}.ev small{font-size:11.5px;color:var(--subtle)}.ev .tt{font-size:11.5px;color:var(--subtle);font-weight:500}
  .ev.new{animation:evin .6s cubic-bezier(.2,.8,.2,1)}@keyframes evin{from{opacity:0;transform:translateY(-12px)}}
  /* grafik */
  .chart{position:relative}.chart svg{width:100%;height:auto;overflow:visible}
  .tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:9px;transform:translate(-50%,-110%);white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5;box-shadow:var(--shadow)}
  .tip.on{opacity:1}.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  .bars{display:flex;flex-direction:column;gap:10px}.brow{display:grid;grid-template-columns:128px 1fr 32px;gap:10px;align-items:center;font-size:12.5px}
  .brow .tr{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}.brow .fl{height:100%;border-radius:99px;background:var(--accent);transition:width .7s cubic-bezier(.2,.8,.2,1)}
  .brow span:first-child{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brow b{text-align:right;font-variant-numeric:tabular-nums}
  .toast{position:fixed;z-index:90;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:13px;font-weight:500;opacity:0;transition:.3s;pointer-events:none;box-shadow:var(--shadow-lg)}.toast.on{opacity:1;transform:translate(-50%,0)}
  /* B */
  .ring{position:relative;width:176px;height:176px;flex:none}.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}.ring .c b{font-size:40px;letter-spacing:-.03em;font-weight:600;display:block;line-height:1}.ring .c span{font-size:12px;color:var(--subtle)}
  .mini{display:flex;flex-direction:column;gap:12px;flex:1}.mrow{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}.mrow .tr{height:6px;flex:1;border-radius:9px;background:var(--surface-2);overflow:hidden;margin:0 12px}.mrow .tr i{display:block;height:100%;border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .tm{display:flex;flex-direction:column;gap:4px;height:230px}.tm .row{display:flex;gap:4px;flex:1}
  .tm button{border:0;border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:#fff;transition:.2s;min-width:0;position:relative;overflow:hidden}
  .tm button:hover{filter:brightness(1.08);transform:scale(.99)} .tm button b{font-size:12.5px} .tm button span{font-size:22px;font-weight:600;letter-spacing:-.02em}
  .tm.dim button:not(.sel){opacity:.28;filter:saturate(.4)} .tm button.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--teal)}
  .hist{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:8px}.hist .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
  .hist .b{width:100%;border-radius:9px 9px 4px 4px;background:var(--accent);min-height:3px;transition:height .7s cubic-bezier(.2,.8,.2,1);position:relative}.hist .b:hover{filter:brightness(1.15)}.hist .b em{position:absolute;top:-19px;left:0;right:0;text-align:center;font-style:normal;font-size:11.5px;font-weight:700}
  .hist label{font-size:11px;color:var(--subtle)}
  .stack{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;margin-bottom:12px}.stack i{display:block;height:100%}
  .fchip{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);padding:6px 8px 6px 13px;border-radius:99px;font-size:12.5px;font-weight:600}.fchip button{border:0;background:var(--accent);color:var(--accent-fg);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;padding:0}
  .months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}.mo{border-radius:11px;background:var(--surface-2);padding:8px 4px;text-align:center;font-size:11px;color:var(--subtle);position:relative;transition:.2s;cursor:default}
  .mo b{display:block;font-size:17px;color:var(--fg);margin-top:2px}.mo.hot{background:color-mix(in srgb,var(--warn) 18%,transparent)}.mo.hot b{color:var(--warn)}.mo:hover{transform:translateY(-2px)}
  /* C bento */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;grid-auto-flow:dense}
  .w{grid-column:span 2;position:relative;transition:transform .2s,opacity .2s}.w.c3{grid-column:span 3}.w.c4{grid-column:span 4}.w.c6{grid-column:span 6}
  .edit .w{cursor:grab;outline:2px dashed color-mix(in srgb,var(--teal) 55%,transparent);outline-offset:3px;animation:wig .5s ease-in-out infinite alternate}.edit .w.drag{opacity:.35}.edit .w.over{outline-color:var(--accent);outline-style:solid;transform:scale(1.015)}
  @keyframes wig{from{transform:rotate(-.12deg)}to{transform:rotate(.12deg)}}
  .wtool{display:none;position:absolute;top:8px;right:8px;gap:5px;z-index:4}.edit .wtool{display:flex}
  .wtool button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;padding:0;color:var(--muted)}.wtool button:hover{color:var(--accent);border-color:var(--accent)}.wtool svg{width:13px;height:13px}
  .tray{display:none;margin-bottom:14px;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:14px;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted)}.edit-on .tray{display:flex}
  .w .card{height:100%}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick button{border:1px solid var(--border);background:var(--surface-2);border-radius:13px;padding:12px;text-align:left;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;gap:8px;transition:.15s}.quick button:hover{border-color:var(--teal);background:var(--accent-soft)}.quick svg{width:18px;height:18px;color:var(--accent)}
  /* özellikler */
  .fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
  .feat{display:flex;flex-direction:column;gap:12px}.feat h3{font-size:15px}.feat p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
  .meta{display:flex;gap:6px;flex-wrap:wrap}.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}.pill.hi{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.pill.md{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.pill.ac{background:var(--accent-soft);color:var(--accent)}
  .demo{background:var(--surface-2);border-radius:14px;padding:14px;min-height:150px;position:relative}
  .bell{position:relative}.bell .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:99px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface-2)}[data-theme=dark] .bell .dot{color:#2a0a14}
  .pop{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}.pop .ph{padding:10px 14px;display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border)}.pop .ph button{border:0;background:none;color:var(--link);font-size:12px;font-weight:600}
  .ni{display:flex;gap:10px;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--border);position:relative;transition:.3s}.ni:last-child{border:0}.ni.unread::after{content:'';position:absolute;right:12px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--teal)}.ni .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;flex:none}.ni .ic svg{width:14px;height:14px}.ni p{margin:0}.ni small{color:var(--subtle)}
  .scan{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}.pr{position:relative;width:96px;height:96px}.pr .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--subtle)}.pr .c b{font-size:21px;color:var(--fg);display:block}
  .scanlist{display:flex;flex-direction:column;gap:5px;max-height:132px;overflow:auto;margin-top:12px}.si{display:flex;align-items:center;gap:9px;font-size:12px;padding:6px 9px;border-radius:9px;background:var(--surface);border:1px solid var(--border);transition:.3s}.si .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);display:grid;place-items:center;flex:none;transition:.3s}.si.ok{border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}.si.ok .ck{background:var(--ok);border-color:var(--ok);color:#fff}.si.ok .ck svg{width:11px}.si .ck svg{width:0}.si.flash{animation:flash .8s}@keyframes flash{0%{box-shadow:0 0 0 0 var(--teal)}100%{box-shadow:0 0 0 12px transparent}}
  .doc{background:#fff;color:#1a1420;border-radius:6px;padding:20px 22px;font-size:10.5px;box-shadow:var(--shadow);line-height:1.5}.doc .dh{display:flex;gap:10px;align-items:center;border-bottom:2px solid #462b55;padding-bottom:9px;margin-bottom:10px}.doc .dh .lg{width:130px}.doc h4{margin:0 0 2px;font-size:12.5px;text-align:center;letter-spacing:.04em}.doc table{width:100%;border-collapse:collapse;margin:8px 0}.doc th,.doc td{border:1px solid #cfc7d8;padding:4px 6px;text-align:left}.doc th{background:#f1ecf5}.doc .sg{display:flex;gap:14px;margin-top:14px}.doc .sg div{flex:1;border-top:1px solid #1a1420;padding-top:4px;text-align:center;font-size:9.5px}
  .kan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kcol{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;min-height:150px;transition:.2s}.kcol.over{border-color:var(--teal);background:var(--accent-soft)}.kcol h5{margin:2px 4px 8px;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--subtle);display:flex;justify-content:space-between}

function spark(vals, col) {

}
function areaChart(host, series, labels, opt = {}) {

  const X = (i) => pl + (i / (n - 1)) * (W - pl - 8), Y = (v) => pt + (1 - v / mx) * (H - pt - pb);
  const path = (v) => v.map((x, i) => { if (!i) return `M${X(0)} ${Y(x)}`; const px = X(i - 1), py = Y(v[i - 1]), cx = (px + X(i)) / 2; return `C${cx} ${py} ${cx} ${Y(x)} ${X(i)} ${Y(x)}`; }).join(' ');
  const grid = [0, .25, .5, .75, 1].map((f) => { const y = pt + f * (H - pt - pb); return `<line x1="${pl}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="var(--border)" stroke-dasharray="3 5"/><text x="0" y="${y + 4}" font-size="10.5" fill="var(--subtle)">${Math.round(mx * (1 - f))}</text>`; }).join('');
  const xt = labels.map((l, i) => (i % Math.ceil(n / 6) === 0 ? `<text x="${X(i)}" y="${H - 4}" font-size="10.5" fill="var(--subtle)" text-anchor="middle">${l}</text>` : '')).join('');
  const defs = series.map((s, k) => `<linearGradient id="ag${k}${opt.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.c}" stop-opacity=".28"/><stop offset="1" stop-color="${s.c}" stop-opacity="0"/></linearGradient>`).join('');
  const areas = series.map((s, k) => `<path d="${path(s.v)} L${X(n - 1)} ${H - pb} L${X(0)} ${H - pb}Z" fill="url(#ag${k}${opt.id})"/><path d="${path(s.v)}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round"/>`).join('');
  host.innerHTML = `<svg viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${grid}${xt}${areas}<line class="cx" y1="${pt}" y2="${H - pb}" stroke="var(--border-strong)" opacity="0"/>${series.map((s) => `<circle class="dt" r="4.5" fill="var(--surface)" stroke="${s.c}" stroke-width="2.4" opacity="0"/>`).join('')}<rect class="hit" x="${pl}" y="0" width="${W - pl}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = $('svg', host), tip = $('.tip', host);
  $('.hit', host).addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * W, i = Math.max(0, Math.min(n - 1, Math.round(((x - pl) / (W - pl - 8)) * (n - 1))));
    $('.cx', host).setAttribute('x1', X(i)); $('.cx', host).setAttribute('x2', X(i)); $('.cx', host).setAttribute('opacity', 1);
    $$('.dt', host).forEach((c, k) => { c.setAttribute('cx', X(i)); c.setAttribute('cy', Y(series[k].v[i])); c.setAttribute('opacity', 1); });
    tip.style.left = (X(i) / W) * r.width + 'px'; tip.style.top = Math.min(...series.map((s) => Y(s.v[i]))) / H * r.height + 'px';
    tip.innerHTML = `<b>${labels[i]}</b> · ` + series.map((s) => `${s.n}: <b>${s.v[i]}</b>`).join(' · '); tip.classList.add('on');

  let counted = 0; $('#scanBtn').onclick = () => { const items = $$('#cntList .si:not(.ok)'); if (!items.length) { toast('Sayım tamamlandı · eksik cihaz yok'); return; } const i = items[Math.floor(Math.random() * items.length)]; i.classList.add('ok', 'flash'); i.scrollIntoView({ block: 'nearest' }); counted++; $('#cntN').textContent = `${counted}/${COUNT.length}`; $('#cntArc').style.strokeDashoffset = 251 * (1 - counted / COUNT.length); $('#cntMsg').textContent = counted === COUNT.length ? 'Sayım tamamlandı ✓ rapor hazır' : `${COUNT.length - counted} cihaz hâlâ okutulmadı`; };
  // kanban
  let kc = null; const kan = $('#kan');
  kan.addEventListener('dragstart', (e) => { kc = e.target.closest('.kc'); kc?.classList.add('dragging'); });
  kan.addEventListener('dragend', () => { kc?.classList.remove('dragging'); $$('.kcol', kan).forEach((c) => c.classList.remove('over')); });
  kan.addEventListener('dragover', (e) => { e.preventDefault(); const c = e.target.closest('.kcol'); $$('.kcol', kan).forEach((x) => x.classList.toggle('over', x === c)); });
  kan.addEventListener('drop', (e) => { e.preventDefault(); const c = e.target.closest('.kcol'); if (!c || !kc) return; c.appendChild(kc); $$('.kcol', kan).forEach((x) => ($('h5 span', x).textContent = $$('.kc', x).length)); if (c.dataset.k === 'coz') toast('Çözüldü → cihaz otomatik olarak Depoya döndü'); });
}

    <div class="rd"><div><b>Flutter mobil uygulama</b><p>Sayım, QR okuma, teslim/iade/arıza ve kişisel zimmet; tüm uç noktalar hazır olacak.</p></div></div></div></div>`;
}

/* ───── gezinti ───── */
const views = { A: renderA, B: renderB, C: renderC, F: renderF, R: renderR };
const rendered = {};
function go(v) {
  $$('.tab').forEach((t) => t.setAttribute('aria-selected', t.dataset.v === v));
  $$('.view').forEach((x) => x.classList.toggle('on', x.id === 'v' + v));
  if (!rendered[v] || v === 'B') { views[v](); rendered[v] = 1; } else if (v === 'A') { views.A(); }
  location.hash = v;
}
$$('.tab').forEach((t) => (t.onclick = () => go(t.dataset.v)));
$('#themeBtn').onclick = () => { document.documentElement.dataset.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; const v = (location.hash || '#A').slice(1); if (v === 'A' || v === 'B' || v === 'C') { views[v](); } };
document.addEventListener('click', (e) => { const b = e.target.closest('[data-t]'); if (b && !b.closest('.tm') && b.dataset.t.length > 1 && !b.classList.contains('tab')) toast(b.dataset.t); });
go(views[(location.hash || '#A').slice(1)] ? (location.hash || '#A').slice(1) : 'A');
</script>
